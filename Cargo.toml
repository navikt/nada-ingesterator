[package]
name = "ingesterator"
version = "0.1.0"
edition = "2024"

[dependencies]
kube = { version = "5", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.29.0", features = ["latest", "schemars"] }
schemars = { version = "1" }
sqlx = { version = "0.9", features = ["postgres", "runtime-tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_with = { version = "3" , features = []}
serde_json = "1"
tracing = "0"
tracing-subscriber = "0"
futures = "0"
clap = { version = "4", features = ["derive", "env"] }
serde_yaml = "0"
