[package]
name = "ingesterator"
version = "0.1.0"
edition = "2024"

[dependencies]
kube = { version = "4.2.0", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.28.0", features = ["latest", "schemars"] }
schemars = { version = "1" }
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio"] }
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_with = { version = "3.24.0" , features = []}
serde_json = "1.0.154"
